<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACCESS GRANTED</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: #292a31;
    font-family: Arial, sans-serif;
}

.page {
    max-width: 680px;
    margin: auto;
}

.hero {
    width: 100%;
    height: 390px;
    object-fit: cover;
    display: block;
}

.content {
    padding: 40px 35px 70px;
}

h1 {
    font-size: 38px;
    margin: 0 0 10px;
}

.author {
    font-size: 18px;
    color: #555;
    margin-bottom: 40px;
}

.stats {
    font-size: 18px;
    margin-bottom: 45px;
}

.description {
    font-size: 19px;
    line-height: 1.6;
    margin-bottom: 50px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
    font-size: 18px;
}

.label {
    color: #666;
}

.date {
    text-align: right;
}

.countdown-title {
    text-align: center;
    margin-top: 45px;
    color: #777;
}

.timer {
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    margin: 15px 0;
}

.status {
    text-align: center;
    color: #777;
}

@media (max-width: 600px) {
    .hero {
        height: 330px;
    }

    .content {
        padding: 30px 25px;
    }

    h1 {
        font-size: 34px;
    }

    .timer {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- КАРТИНКА -->
    <img
        class="hero"
        src="IMAGE_URL"
        alt="ACCESS GRANTED"
    >

    <div class="content">

        <h1>ACCESS GRANTED</h1>

        <div class="author">
            DOORS 👁️ [🇷🇺]
        </div>

        <div class="stats">
            ◷ In 1 day　 ♙ 1.9M interested
        </div>

        <div class="description">

            <strong>
                PENDING... ADMINISTRATOR APPROVING...<br>
                ACCESS GRANTED
            </strong>

            <br><br>

            You have been given access to a terrifying <strong>more</strong>.

        </div>

        <div class="row">
            <span class="label">
                Start time
            </span>

            <span class="date">
                Oct 2, 2026 9:00 PM
            </span>
        </div>

        <div class="countdown-title">
            Time remaining
        </div>

        <div class="timer" id="timer">
            00:00:00:00
        </div>

        <div class="status" id="status">
            Waiting for access...
        </div>

    </div>

</div>

<script>

/*
====================================
ОБРАТНЫЙ ОТСЧЁТ
2 ОКТЯБРЯ 2026 — 21:00
====================================
*/

const targetDate = new Date(
    2026,
    9,
    2,
    21,
    0,
    0
);

function updateCountdown() {

    const now = new Date();

    let difference = targetDate - now;

    if (difference <= 0) {

        document.getElementById("timer").textContent =
            "00:00:00:00";

        document.getElementById("status").textContent =
            "ACCESS GRANTED";

        return;
    }

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    difference %= (1000 * 60 * 60 * 24);

    const hours = Math.floor(
        difference / (1000 * 60 * 60)
    );

    difference %= (1000 * 60 * 60);

    const minutes = Math.floor(
        difference / (1000 * 60)
    );

    difference %= (1000 * 60);

    const seconds = Math.floor(
        difference / 1000
    );

    const d = String(days).padStart(2, "0");
    const h = String(hours).padStart(2, "0");
    const m = String(minutes).padStart(2, "0");
    const s = String(seconds).padStart(2, "0");

    document.getElementById("timer").textContent =
        `${d}:${h}:${m}:${s}`;
}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
