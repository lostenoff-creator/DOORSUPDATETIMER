<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOORS Update</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at 50% 45%, #241010 0%, #0b0505 28%, #000 65%);
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* Тонкая сетка на фоне */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
    }

    .glow {
        position: fixed;
        width: 450px;
        height: 450px;
        background: #7d1111;
        filter: blur(150px);
        opacity: 0.18;
        border-radius: 50%;
        pointer-events: none;
    }

    .card {
        width: min(90%, 700px);
        padding: 55px 35px;
        text-align: center;

        background: rgba(15, 15, 15, 0.72);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 24px;

        box-shadow:
            0 25px 80px rgba(0,0,0,0.8),
            inset 0 0 40px rgba(255,255,255,0.015);

        backdrop-filter: blur(12px);
        position: relative;
        z-index: 2;
    }

    .label {
        color: #9b9b9b;
        font-size: 12px;
        letter-spacing: 5px;
        text-transform: uppercase;
        margin-bottom: 18px;
    }

    h1 {
        margin: 0;
        font-size: clamp(26px, 6vw, 42px);
        font-weight: 600;
        letter-spacing: -1px;
    }

    .line {
        width: 55px;
        height: 2px;
        background: #b52a2a;
        margin: 25px auto 30px;
        box-shadow: 0 0 15px #b52a2a;
    }

    #timer {
        font-size: clamp(32px, 8vw, 64px);
        font-weight: 700;
        letter-spacing: 3px;
        font-variant-numeric: tabular-nums;

        text-shadow:
            0 0 25px rgba(255,255,255,0.12);
    }

    .units {
        margin-top: 12px;
        color: #666;
        font-size: 10px;
        letter-spacing: 5px;
    }

    .status {
        margin-top: 35px;
        color: #777;
        font-size: 12px;
    }

    .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #c52c2c;
        border-radius: 50%;
        margin-right: 7px;
        box-shadow: 0 0 10px #c52c2c;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
            transform: scale(1);
        }

        50% {
            opacity: 0.35;
            transform: scale(0.7);
        }
    }

    @media (max-width: 500px) {
        .card {
            padding: 45px 20px;
            border-radius: 20px;
        }

        #timer {
            letter-spacing: 1px;
        }

        .units {
            letter-spacing: 3px;
        }
    }
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

    <div class="label">DOORS UPDATE</div>

    <h1>Обновление Дорса через</h1>

    <div class="line"></div>

    <div id="timer">00 : 00 : 00 : 00</div>

    <div class="units">
        ДНИ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ЧАСЫ&nbsp;&nbsp;&nbsp;&nbsp; МИНУТЫ&nbsp;&nbsp;&nbsp;&nbsp; СЕКУНДЫ
    </div>

    <div class="status">
        <span class="dot"></span>
        Ожидание обновления
    </div>

</div>

<script>
    const targetDate = new Date("2026-10-02T21:00:00+03:00");

    function updateTimer() {
        const now = new Date();
        const difference = targetDate - now;

        const timer = document.getElementById("timer");

        if (difference <= 0) {
            timer.textContent = "ОБНОВЛЕНИЕ";
            return;
        }

        const days = Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

        const hours = Math.floor(
            (difference / (1000 * 60 * 60)) % 24
        );

        const minutes = Math.floor(
            (difference / (1000 * 60)) % 60
        );

        const seconds = Math.floor(
            (difference / 1000) % 60
        );

        timer.textContent =
            `${String(days).padStart(2, "0")} : ` +
            `${String(hours).padStart(2, "0")} : ` +
            `${String(minutes).padStart(2, "0")} : ` +
            `${String(seconds).padStart(2, "0")}`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
